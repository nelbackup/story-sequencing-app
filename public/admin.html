<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>故事管理後台 - Upload Story Cards</title>
  <style>
    body { font-family: sans-serif; background: #1b162b; color: #fff; padding: 30px; }
    .container { max-width: 700px; margin: auto; background: #27213c; padding: 24px; border-radius: 12px; }
    .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
    input, button, select { padding: 10px; border-radius: 6px; border: 1px solid #555; }
    button { background: #e74c3c; color: white; border: none; font-weight: bold; cursor: pointer; }
    .story-list { margin-top: 30px; }
    .story-item { background: #372e54; padding: 12px; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <div class="container">
    <h2>新增故事卡片組 (Upload Story Set)</h2>
    <form id="storyForm" enctype="multipart/form-data">
      <div class="form-group">
        <label>故事名稱 (Story Title):</label>
        <input type="text" name="title" required placeholder="例如: 買菜記">
      </div>
      <div class="form-group">
        <label>操作指引 (Prompt):</label>
        <input type="text" name="prompt" value="請按順序排列圖片，然後講述故事。">
      </div>
      <div class="form-group">
        <label>倒計時限制秒數 (Duration in seconds):</label>
        <input type="number" name="duration" value="60" required>
      </div>
      <div class="form-group">
        <label>預錄故事音頻 (Audio Clip - MP3/WAV):</label>
        <input type="file" name="audio" accept="audio/*">
      </div>
      <div class="form-group">
        <label>故事圖片 (Select 4 to 6 cards in CORRECT chronological order):</label>
        <input type="file" name="cards" accept="image/*" multiple required>
        <small style="color: #bbb;">注意：請依序選取卡片 1, 2, 3, 4，系統將以此順序作正解核對。</small>
      </div>
      <button type="submit">建立故事組</button>
    </form>

    <div class="story-list">
      <h3>現有故事組列表</h3>
      <div id="storyItems"></div>
    </div>
    <p style="margin-top: 20px;"><a href="/" style="color: #f1c40f;">返回遊戲首頁</a></p>
  </div>

  <script>
    async function loadList() {
      const res = await fetch('/api/stories');
      const data = await res.json();
      const container = document.getElementById('storyItems');
      container.innerHTML = data.map(s => `
        <div class="story-item">
          <span>${s.title} (${s.cards.length} 張卡片 - ${s.durationSeconds}s)</span>
          <button onclick="deleteStory('${s.id}')" style="background:#c0392b; padding: 6px 12px;">刪除</button>
        </div>
      `).join('');
    }

    document.getElementById('storyForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch('/api/stories', { method: 'POST', body: formData });
      if (res.ok) {
        alert('上傳成功！');
        e.target.reset();
        loadList();
      } else {
        alert('上傳失敗');
      }
    });

    async function deleteStory(id) {
      if (!confirm('確定刪除此故事組？')) return;
      await fetch('/api/stories/' + id, { method: 'DELETE' });
      loadList();
    }

    loadList();
  </script>
</body>
</html>
